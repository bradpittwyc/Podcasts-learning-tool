<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: plt-media: file:; media-src 'self' plt-media: file: blob: data:; img-src 'self' data: blob: plt-media: file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" />
<title>Podcasts Learning Tool — 英语学习神器</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/player.css" />
<link rel="stylesheet" href="css/transcript.css" />
<link rel="stylesheet" href="css/panels.css" />
</head>
<body data-theme="light">
  <div class="app-root" id="appRoot">

    <!-- ══════════ 标题栏 ══════════ -->
    <header class="titlebar" id="titlebar">
      <div class="titlebar-left">
        <div class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13a8 8 0 0 1 16 0" />
            <rect x="2.5" y="12.5" width="4" height="7" rx="2" />
            <rect x="17.5" y="12.5" width="4" height="7" rx="2" />
            <path d="M12 3v18" opacity=".45" />
          </svg>
        </div>
        <span class="app-title">Podcasts Learning Tool <span class="app-ver" id="appVersion"></span></span>
        <nav class="menubar" id="menubar">
          <button class="menu-chip" data-menu="file">文件</button>
          <button class="menu-chip" data-menu="play">播放</button>
          <button class="menu-chip" data-menu="learn">学习</button>
          <button class="menu-chip" data-menu="view">视图</button>
          <button class="menu-chip" data-menu="help">帮助</button>
        </nav>
      </div>
      <div class="titlebar-drag" id="titlebarDrag"></div>
      <div class="titlebar-right">
        <div class="wco">
          <button class="wco-btn" id="btnMin" title="最小化"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1" /></svg></button>
          <button class="wco-btn" id="btnMax" title="最大化"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1" /></svg></button>
          <button class="wco-btn wco-close" id="btnClose" title="关闭"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" /></svg></button>
        </div>
      </div>
    </header>

    <!-- ══════════ 命令栏 ══════════ -->
    <div class="commandbar" id="commandbar">
      <div class="cb-group">
        <button class="cb-btn accent" id="btnOpenMedia" title="打开视频/音频 (Ctrl+O)">
          <svg viewBox="0 0 20 20"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h3l1.4 1.6h6.6A1.5 1.5 0 0 1 17 7.1v7.4A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>打开媒体</span>
        </button>
        <button class="cb-btn" id="btnOpenSub" title="选择字幕 / 关闭字幕 / 打开字幕文件 (Ctrl+Shift+O)">
          <svg viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 12h4M11 12h4M5 9h3M10 9h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span id="subLabel">字幕</span>
          <svg viewBox="0 0 20 20" width="12" height="12" style="opacity:.6"><path d="M6 8.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="cb-btn" id="btnOpenFolder" title="批量导入文件夹">
          <svg viewBox="0 0 20 20"><path d="M3 6a1.5 1.5 0 0 1 1.5-1.5h3L9 6h6.5A1.5 1.5 0 0 1 17 7.5V14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14V6Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 9v4M8 11h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>文件夹</span>
        </button>
      </div>

      <div class="cb-sep"></div>

      <div class="cb-group">
        <button class="cb-icon" id="btnPrevLine" title="上一句 (Ctrl+←)"><svg viewBox="0 0 20 20"><path d="M15 5v10L7 10l8-5ZM5 5v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
        <button class="cb-icon big" id="btnPlay" title="播放/暂停 (Space)" aria-label="播放/暂停" disabled>
          <svg viewBox="0 0 20 20" class="ic-play" aria-hidden="true"><path d="M6.4 4.2a.9.9 0 0 1 1.36-.77l7.4 4.8a.9.9 0 0 1 0 1.54l-7.4 4.8A.9.9 0 0 1 6.4 13.8z"/></svg>
          <svg viewBox="0 0 20 20" class="ic-pause" aria-hidden="true"><rect x="5.4" y="4" width="3.5" height="12" rx="1.2"/><rect x="11.1" y="4" width="3.5" height="12" rx="1.2"/></svg>
        </button>
        <button class="cb-icon" id="btnNextLine" title="下一句 (Ctrl+→)"><svg viewBox="0 0 20 20"><path d="M5 5v10l8-5-8-5ZM15 5v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
        <button class="cb-icon" id="btnReplay" title="重播当前句 (Ctrl+R)"><svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 1 1.8 4.3M4 10V6m0 4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="cb-icon" id="btnLoopLine" title="单句循环 (L)"><svg viewBox="0 0 20 20"><path d="M5 7h9a2 2 0 0 1 0 4H6a2 2 0 0 0 0 4h9M14 4l3 3-3 3M6 16l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>

      <div class="cb-sep"></div>

      <div class="cb-group speed-group">
        <button class="cb-icon" id="btnSlow" title="减速 (Ctrl+[)"><svg viewBox="0 0 20 20"><path d="M5 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button class="cb-rate" id="btnRate" title="播放速度">1.0×</button>
        <button class="cb-icon" id="btnFast" title="加速 (Ctrl+])"><svg viewBox="0 0 20 20"><path d="M5 10h10M10 5v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>

      <div class="cb-sep"></div>

      <div class="cb-group">
        <button class="cb-icon" id="btnSubtitleToggle" title="显示/隐藏字幕 (Ctrl+H)"><svg viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 11.5h6M5.5 8.5h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button class="cb-icon" id="btnShadow" title="跟读模式 (跟读打分/录音)"><svg viewBox="0 0 20 20"><rect x="7.5" y="3" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="cb-icon" id="btnScreenOcr" title="屏幕取词·截图 OCR (Ctrl+Shift+S)"><svg viewBox="0 0 20 20"><path d="M3 7V4.8A1.8 1.8 0 0 1 4.8 3H7M13 3h2.2A1.8 1.8 0 0 1 17 4.8V7M17 13v2.2a1.8 1.8 0 0 1-1.8 1.8H13M7 17H4.8A1.8 1.8 0 0 1 3 15.2V13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M7 10h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>

      <div class="cb-spacer"></div>

      <div class="cb-group level-group">
        <div class="level-picker" id="levelPicker" title="扫描时标记哪些词为「达标难词」；所有单词都可以点选查询">
          <span class="level-label">取词级别</span>
          <select id="levelSelect" class="level-select"></select>
        </div>
        <button class="cb-btn" id="btnScanAll" title="按当前级别扫描全文难词 (Ctrl+Shift+D)">
          <svg viewBox="0 0 20 20"><path d="M10 3.5l1.6 3.6 3.9.4-2.9 2.6.8 3.9L10 12.1 6.6 14l.8-3.9L4.5 7.5l3.9-.4L10 3.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span id="scanLabel">扫描难词</span>
        </button>
        <button class="cb-icon" id="btnSettings" title="设置 (Ctrl+,)">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M8.6 2.2h2.8l.42 2.02c.5.16.97.38 1.4.66l1.86-.86 1.98 1.98-.86 1.86c.28.43.5.9.66 1.4l2.02.42v2.8l-2.02.42a6.6 6.6 0 0 1-.66 1.4l.86 1.86-1.98 1.98-1.86-.86c-.43.28-.9.5-1.4.66L11.4 18H8.6l-.42-2.02a6.6 6.6 0 0 1-1.4-.66l-1.86.86-1.98-1.98.86-1.86a6.6 6.6 0 0 1-.66-1.4L1.12 10.6V8.6l2.02-.42c.16-.5.38-.97.66-1.4l-.86-1.86 1.98-1.98 1.86.86c.43-.28.9-.5 1.4-.66z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
            <circle cx="10" cy="9.6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ══════════ 主体 ══════════ -->
    <main class="workspace" id="workspace">

      <!-- 左：播放区 -->
      <section class="pane stage-pane" id="stagePane">
        <div class="stage" id="stage">
          <div class="dropzone" id="dropzone">
            <div class="dropzone-inner">
              <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="11" width="36" height="26" rx="4"/><path d="M20 18.5v11l9-5.5-9-5.5Z"/>
              </svg>
              <h2>把 MP4 / MP3 或字幕文件拖到这里</h2>
              <p class="muted">支持 MP4 · MP3 · M4A · WAV · MKV · MOV 与 SRT · VTT · ASS · LRC · TXT 字幕</p>
              <div class="dropzone-actions">
                <button class="cb-btn accent" id="dzOpen">选择媒体文件</button>
                <button class="cb-btn" id="dzSub">仅导入字幕</button>
                <button class="cb-btn" id="dzFolder">导入文件夹</button>
              </div>
            </div>
          </div>

          <video id="video" class="media" playsinline></video>
          <div id="audioVisual" class="audio-visual hidden">
            <div class="vinyl">
              <svg viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/><circle cx="60" cy="60" r="42" fill="none" stroke="currentColor" stroke-width="1" opacity=".25"/><circle cx="60" cy="60" r="28" fill="none" stroke="currentColor" stroke-width="1" opacity=".2"/><circle cx="60" cy="60" r="9" fill="currentColor" opacity=".5"/></svg>
            </div>
            <div class="audio-title" id="audioTitle">—</div>
            <div class="bars" id="audioBars"></div>
          </div>

          <!-- 字幕浮层 -->
          <div class="subtitle-overlay" id="subtitleOverlay">
            <div class="sub-en" id="overlayEn"></div>
            <div class="sub-zh" id="overlayZh"></div>
          </div>

          <!-- 悬浮迷你控制条 -->
          <div class="mini-controls" id="miniControls">
            <button class="mini-btn" id="miniPlay" title="播放/暂停">
              <svg viewBox="0 0 20 20" class="ic-play" aria-hidden="true"><path d="M6.4 4.2a.9.9 0 0 1 1.36-.77l7.4 4.8a.9.9 0 0 1 0 1.54l-7.4 4.8A.9.9 0 0 1 6.4 13.8z"/></svg>
              <svg viewBox="0 0 20 20" class="ic-pause" aria-hidden="true"><rect x="5.4" y="4" width="3.5" height="12" rx="1.2"/><rect x="11.1" y="4" width="3.5" height="12" rx="1.2"/></svg>
            </button>
            <div class="mini-time" id="miniTime">00:00 / 00:00</div>
            <button class="mini-btn" id="miniSub" title="字幕开关">CC</button>
            <button class="mini-btn" id="miniShadow" title="跟读">🎙</button>
            <button class="mini-btn" id="miniFull" title="全屏 (F)"><svg viewBox="0 0 20 20"><path d="M4 8V4h4M12 4h4v4M16 12v4h-4M8 16H4v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          </div>
        </div>

        <!-- 传输控件 -->
        <div class="transport" id="transport">
          <div class="seek-row">
            <span class="time" id="curTime">00:00</span>
            <div class="seekbar" id="seekbar" tabindex="0" role="slider" aria-label="播放进度">
              <div class="seek-track"><div class="seek-buffered" id="seekBuffered"></div><div class="seek-progress" id="seekProgress"></div><div class="seek-thumb" id="seekThumb"></div></div>
            </div>
            <span class="time" id="durTime">00:00</span>
          </div>
          <div class="transport-row">
            <div class="tr-left">
              <button class="tr-btn" id="trPrev" title="上一句"><svg viewBox="0 0 20 20"><path d="M15 5v10L7 10l8-5ZM5 5v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
              <button class="tr-btn" id="trBack5" title="后退 5 秒">
                <svg viewBox="0 0 20 20"><path d="M9.6 4.6H15a4.4 4.4 0 0 1 0 8.8h-2.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11.4 2.4 8.6 4.7l2.8 2.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="tr-btn play" id="trPlay" title="播放/暂停">
                <svg viewBox="0 0 20 20" class="ic-play" aria-hidden="true"><path d="M6.4 4.2a.9.9 0 0 1 1.36-.77l7.4 4.8a.9.9 0 0 1 0 1.54l-7.4 4.8A.9.9 0 0 1 6.4 13.8z"/></svg>
                <svg viewBox="0 0 20 20" class="ic-pause" aria-hidden="true"><rect x="5.4" y="4" width="3.5" height="12" rx="1.2"/><rect x="11.1" y="4" width="3.5" height="12" rx="1.2"/></svg>
              </button>
              <button class="tr-btn" id="trFwd5" title="前进 5 秒">
                <svg viewBox="0 0 20 20"><path d="M10.4 4.6H5a4.4 4.4 0 0 0 0 8.8h2.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M8.6 2.4l2.8 2.3-2.8 2.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="tr-btn" id="trNext" title="下一句"><svg viewBox="0 0 20 20"><path d="M5 5v10l8-5-8-5ZM15 5v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
            </div>

            <div class="tr-mid">
              <div class="rate-presets" id="ratePresets">
                <button data-rate="0.25" class="rate-chip">0.25×</button>
                <button data-rate="0.5" class="rate-chip">0.5×</button>
                <button data-rate="0.75" class="rate-chip">0.75×</button>
                <button data-rate="1" class="rate-chip active">1.0×</button>
                <button data-rate="1.25" class="rate-chip">1.25×</button>
                <button data-rate="1.5" class="rate-chip">1.5×</button>
                <button data-rate="1.75" class="rate-chip">1.75×</button>
                <button data-rate="2" class="rate-chip">2.0×</button>
                <button data-rate="2.5" class="rate-chip">2.5×</button>
              </div>
            </div>

            <div class="tr-right">
              <button class="tr-btn" id="trLoop" title="循环模式"><svg viewBox="0 0 20 20"><path d="M5 7h9a2 2 0 0 1 0 4H6a2 2 0 0 0 0 4h9M14 4l3 3-3 3M6 16l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="loop-badge hidden" id="loopBadge">1</span></button>
              <button class="tr-btn" id="trAB" title="A-B 复读：点击设置 A 点，再点设置 B 点">A-B</button>
              <div class="volume">
                <button class="tr-btn" id="trMute" title="静音"><svg viewBox="0 0 20 20"><path d="M5 8h2.5L11 5.5v9L7.5 12H5V8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M13.5 8.2a3 3 0 0 1 0 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="1" title="音量" />
              </div>
              <button class="tr-btn" id="trPip" title="画中画"><svg viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="9.5" width="6" height="4.5" rx="1" fill="currentColor" opacity=".6"/></svg></button>
              <button class="tr-btn" id="trFull" title="全屏 (F)"><svg viewBox="0 0 20 20"><path d="M4 8V4h4M12 4h4v4M16 12v4h-4M8 16H4v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
            </div>
          </div>
        </div>
      </section>

      <!-- 右：文字区 -->
      <section class="pane text-pane" id="textPane">
        <div class="pane-header">
          <div class="ph-tabs" id="paneTabs">
            <button class="ph-tab active" data-tab="transcript">字幕文本</button>
            <button class="ph-tab" data-tab="vocab">生词本 <span class="badge" id="vocabCount">0</span></button>
            <button class="ph-tab" data-tab="history">最近打开</button>
          </div>
          <div class="ph-actions">
            <button class="ph-btn" id="btnEdit" title="校对模式：直接修改字幕文本与时间戳">校对</button>
            <button class="ph-btn" id="btnShift" title="整体平移时间轴">时间轴</button>
            <button class="ph-btn" id="btnSaveSub" title="保存校对后的字幕 (Ctrl+S)">保存</button>
            <button class="ph-btn" id="btnExpandAll" title="显示/隐藏全部中文">中英</button>
          </div>
        </div>

        <!-- 校对工具条 -->
        <div class="editbar hidden" id="editbar">
          <span class="editbar-title">校对模式</span>
          <button class="ph-btn" data-shift="-0.5">−0.5s</button>
          <button class="ph-btn" data-shift="-0.1">−0.1s</button>
          <button class="ph-btn" data-shift="0.1">+0.1s</button>
          <button class="ph-btn" data-shift="0.5">+0.5s</button>
          <span class="editbar-sep"></span>
          <button class="ph-btn" id="btnSplitCue" title="在当前播放位置把选中行拆成两句">拆分</button>
          <button class="ph-btn" id="btnMergeCue" title="与下一行合并">合并</button>
          <button class="ph-btn" id="btnInsertCue" title="在选中行后插入新行">插入</button>
          <button class="ph-btn" id="btnDeleteCue" title="删除选中行">删除</button>
          <span class="editbar-sep"></span>
          <button class="ph-btn" id="btnSetStart" title="用当前播放时间设置选中行开始时间">设为开始</button>
          <button class="ph-btn" id="btnSetEnd" title="用当前播放时间设置选中行结束时间">设为结束</button>
          <span class="editbar-spacer"></span>
          <span class="muted small" id="editHint">双击文本即可编辑 · Esc 退出</span>
        </div>

        <div class="pane-body" id="paneBody">
          <div class="transcript" id="transcript" tabindex="0"></div>

          <div class="vocab-view hidden" id="vocabView">
            <div class="vocab-toolbar">
              <input type="search" id="vocabSearch" placeholder="搜索生词、释义…" />
              <select id="vocabSort"><option value="addedAt">按添加时间</option><option value="alpha">按字母</option><option value="level">按难度</option></select>
              <button class="ph-btn" id="btnVocabExport">导出 CSV</button>
              <button class="ph-btn" id="btnVocabDrill">闪卡复习</button>
              <button class="ph-btn danger" id="btnVocabClear">清空</button>
            </div>
            <div class="vocab-list" id="vocabList"></div>
          </div>

          <div class="history-view hidden" id="historyView">
            <div class="vocab-toolbar">
              <span class="muted" id="historyHint">双击记录可重新打开（自动加载同名字幕）</span>
              <button class="ph-btn danger" id="btnHistoryClear">清空记录</button>
            </div>
            <div class="vocab-list" id="historyList"></div>
          </div>
        </div>

        <!-- 查词面板 -->
        <aside class="dict-panel hidden" id="dictPanel">
          <div class="dict-head">
            <div class="dict-word-wrap">
              <span class="dict-word" id="dictWord">—</span>
              <span class="dict-phonetic" id="dictPhonetic"></span>
            </div>
            <div class="dict-tags" id="dictTags"></div>
            <button class="icon-btn" id="dictClose" title="关闭">&times;</button>
          </div>
          <div class="dict-body" id="dictBody">
            <div class="dict-empty" id="dictEmpty">点选正文中的英文单词即可查询释义</div>
          </div>
          <div class="dict-foot">
            <button class="ph-btn" id="dictSpeak">🔊 朗读</button>
            <button class="ph-btn" id="dictSave">＋ 生词本</button>
            <button class="ph-btn" id="dictRetry">重新查询</button>
          </div>
        </aside>
      </section>
    </main>

    <!-- ══════════ 状态栏 ══════════ -->
    <footer class="statusbar" id="statusbar">
      <span class="sb-item" id="sbFile">未加载媒体</span>
      <span class="sb-item" id="sbSubs">无字幕</span>
      <span class="sb-item" id="sbLine"></span>
      <span class="sb-spacer"></span>
      <span class="sb-item" id="sbCost" title="本次会话大模型用量"></span>
      <span class="sb-item" id="sbPortable"></span>
      <span class="sb-item" id="sbUpdate" title="有新版本可用"></span>
      <span class="sb-item" id="sbMode"></span>
    </footer>
  </div>

  <!-- ══════════ 浮层容器 ══════════ -->
  <div class="modal-host hidden" id="modalHost"></div>
  <div class="toast-host" id="toastHost"></div>
  <div class="context-menu hidden" id="contextMenu"></div>
  <div class="ocr-overlay hidden" id="ocrOverlay">
    <div class="ocr-tip" id="ocrTip">按住鼠标左键框选要取词的屏幕区域 · Esc 取消</div>
    <div class="ocr-shade"></div>
    <div class="ocr-sel" id="ocrSel"></div>
    <canvas id="ocrCanvas" class="hidden"></canvas>
  </div>
  <div class="shadow-panel hidden" id="shadowPanel">
    <div class="sp-head"><span>🎙 跟读练习</span><button class="icon-btn" id="spClose">&times;</button></div>
    <div class="sp-body">
      <div class="sp-line" id="spLine">选择一句字幕开始跟读</div>
      <div class="sp-controls">
        <button class="cb-btn accent" id="spRec">● 开始录音</button>
        <button class="cb-btn" id="spPlayRec">▶ 播放录音</button>
        <button class="cb-btn" id="spSaveRec">保存</button>
        <button class="cb-btn" id="spCompare">A/B 对比</button>
      </div>
      <div class="sp-meter"><div class="sp-meter-fill" id="spMeter"></div></div>
      <div class="sp-hint muted small" id="spHint">按「开始录音」后跟读这句话，可保存录音用于对比。</div>
      <label class="sp-check"><input type="checkbox" id="spAutoNext" /> 录完自动下一句</label>
      <label class="sp-check"><input type="checkbox" id="spGap" /> 原句后留出跟读时间（自动暂停）</label>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/player.js"></script>
  <script src="js/transcript.js"></script>
  <script src="js/dict.js"></script>
  <script src="js/shadow.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/updater-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
