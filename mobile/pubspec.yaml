name: podcasts_learning_tool
description: "英语学习播放器 — 安卓平板/手机：本地媒体+字幕跟读、点句跳转、大模型分级取词（iOS 为下一步）。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # 媒体播放（安卓底层 ExoPlayer，支持自定义字幕叠加）
  video_player: ^2.8.2
  # 打开本地媒体 + 字幕文件
  file_picker: ^13.1.0
  # LLM 分级查词
  http: ^1.2.1
  # 跟读录音
  record: ^7.1.1
  # 本地设置 / Key 存储
  shared_preferences: ^2.3.2
  # 文件路径
  path_provider: ^2.1.3
  # 跟读录音回放
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
