name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 自检（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: 运行自检
        run: npm test

  package:
    name: 打包（便携版 + 安装版）
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: 构建安装版与便携版
        run: npx electron-builder --win --publish never
      - name: 产出清单
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: PodcastsLearningTool-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: false
          generate_release_notes: true
